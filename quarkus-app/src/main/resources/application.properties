# Homedir IDP Configuration

# Application
quarkus.application.name=Homedir IDP
quarkus.application.version=0.1.0

# HTTP
quarkus.http.port=8090
quarkus.http.host=0.0.0.0
quarkus.http.cors=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.homedir.idp".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.json=false

# Qute Templates
quarkus.qute.content-types.html=text/html
quarkus.qute.suffixes=html,txt

# Dev Mode
quarkus.live-reload.instrumentation=false
%dev.quarkus.log.console.color=true

# GitHub Integration (set via env vars)
github.token=${GITHUB_TOKEN:}
github.org=${GITHUB_ORG:os-santiago}

# VPS Configuration (set via env vars)
vps.host=${VPS_HOST:72.60.141.165}
vps.user=${VPS_USER:root}
vps.ssh.key.path=${VPS_SSH_KEY:/path/to/key}

# Templates
templates.base.url=https://github.com/os-santiago/homedir.git
templates.storage.path=./templates

# Golden Path Configuration
idp.template.storage.path=${IDP_TEMPLATE_DIR:./data/templates}
idp.project.storage.path=${IDP_PROJECT_DIR:./data/projects}
idp.scaffold.temp.dir=${IDP_TEMP_DIR:/tmp/idp-scaffold}

# GitHub Service Configuration
idp.github.token=${IDP_GITHUB_TOKEN:}
idp.github.token.file=${IDP_GITHUB_TOKEN_FILE:/etc/homedir-idp-secrets/github-token}
idp.github.default.org=${IDP_GITHUB_ORG:os-santiago}
idp.github.template.repo=https://github.com/os-santiago/homedir.git
idp.github.template.branch=main

# VPS Provisioning Configuration
idp.vps.host=${IDP_VPS_HOST:72.60.141.165}
idp.vps.user=${IDP_VPS_USER:root}
idp.vps.ssh.key.path=${IDP_VPS_SSH_KEY_PATH:/root/.ssh/id_ed25519}
idp.vps.nginx.sites.path=/etc/nginx/sites-available
idp.vps.systemd.path=/etc/systemd/system

# Container Registry Configuration
idp.registry.url=${IDP_REGISTRY_URL:quay.io}
idp.registry.username=${IDP_REGISTRY_USERNAME:}
idp.registry.password=${IDP_REGISTRY_PASSWORD:}

# Deployment Configuration
idp.deployment.timeout.minutes=10
idp.deployment.health.check.retries=30
idp.deployment.health.check.interval.seconds=10

# Security (disabled for MVP - will add authentication later)
#quarkus.http.auth.basic=true
#quarkus.security.users.embedded.enabled=true
#quarkus.security.users.embedded.plain-text=true
#quarkus.security.users.embedded.users.admin=admin
#quarkus.security.users.embedded.roles.admin=admin

# OIDC (GitHub OAuth - disabled for MVP, will configure later)
quarkus.oidc.enabled=false
#%prod.quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=https://github.com/login/oauth/authorize
quarkus.oidc.client-id=${GITHUB_CLIENT_ID:}
quarkus.oidc.credentials.secret=${GITHUB_CLIENT_SECRET:}

# Native Build
quarkus.native.additional-build-args=--initialize-at-run-time=org.eclipse.jgit
